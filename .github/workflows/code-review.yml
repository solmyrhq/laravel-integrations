name: Code Review

on:
    pull_request_target:
        types: [opened, synchronize, ready_for_review, reopened]
    workflow_dispatch:
        inputs:
            pr:
                description: Pull request number
                required: true

permissions: {}

jobs:
    review:
        uses: solmyrhq/actions/.github/workflows/review.yml@834e083de65dcd5f2958dc619c008c63af70866f
        permissions:
            actions: read
            contents: write
            id-token: write
            pull-requests: write
        with:
            pr: ${{ inputs.pr }}
            guide: AGENTS.md
        secrets: inherit
