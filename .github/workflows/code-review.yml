name: Code Review

on:
    pull_request_target:
        types: [opened, synchronize, ready_for_review, reopened]
    workflow_dispatch:
        inputs:
            pr:
                description: Pull request number
                required: true

permissions: {}

jobs:
    review:
        uses: solmyrhq/actions/.github/workflows/review.yml@f30abd24979db58ee2c26f75e5a700c34ee09ad7
        permissions:
            actions: read
            contents: write
            id-token: write
            pull-requests: write
        with:
            pr: ${{ inputs.pr }}
            guide: AGENTS.md
        secrets: inherit
