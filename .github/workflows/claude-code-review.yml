name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    claude-review:
        name: Review pull request
        # Only pull requests from a branch in this repository are reviewed, and only someone with write access can
        # push such a branch. GitHub withholds secrets from a pull request opened from a fork, so claude-code-action
        # would fail on one without CLAUDE_CODE_OAUTH_TOKEN. author_association isn't checked: in the pull_request
        # event, GitHub reported the same organization member as CONTRIBUTOR in solmyrhq/actions and MEMBER in
        # solmyrhq/gingerbread, so that member's pull requests went unreviewed in solmyrhq/actions.
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        # claude-code-action posts the review with its Claude GitHub App token, which it gets through an OIDC
        # exchange, so pull-requests and issues permissions are left out here.
        permissions:
            contents: read
            id-token: write
            actions: read # claude-code-action skips its github_ci MCP server without this.

        steps:
            - name: Checkout repository
              id: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  # claude-code-action fetches with its own app token, and v1.0.235 can't remove credentials that
                  # checkout v6 persists.
                  persist-credentials: false

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
              env:
                  # Under this action, Claude Code ends the run when the model
                  # returns its final result, even if subagents started in the
                  # background are still working, so their findings are never
                  # posted.
                  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # The Claude GitHub App token needs its default contents: write. GitHub rejects resolveReviewThread
                  # from an app token without contents: write, even with pull_requests: write. Without it, the job
                  # still succeeds and the review threads stay unresolved.

                  base_branch: ${{ github.event.pull_request.base.ref }}

                  # With a prompt and no track_progress, the action runs in agent mode. In agent mode it starts
                  # the inline-comment and CI MCP servers only when their tools are listed in --allowedTools.
                  claude_args: |
                      --model claude-opus-5-5
                      --effort high
                      --allowedTools
                      "Read"
                      "Glob"
                      "Grep"
                      "Task"
                      "Agent"
                      "TodoWrite"
                      "Bash(gh pr view ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh pr diff ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate)"
                      "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --paginate)"
                      "Bash(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate)"
                      "Bash(gh api graphql:*)"
                      "mcp__github_inline_comment__create_inline_comment"
                      "mcp__github_ci__get_ci_status"
                      "mcp__github_ci__get_workflow_run_details"
                      "mcp__github_ci__download_job_log"

                  # .claude/skills/exhaustive-review is a copy of the skill in agent-config.
                  prompt: |
                      /exhaustive-review You are running in CI. Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} at head commit ${{ github.event.pull_request.head.sha }}.

            - name: Print Claude's error
              if: failure() && steps.claude-review.outputs.execution_file != ''
              env:
                  EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
              run: jq 'map(select(.type == "result")) | last | {subtype, is_error, result, errors}' "$EXECUTION_FILE"

            # If the job is cancelled while claude-code-action runs, the action's revoke step can be skipped, and the
            # app token stays valid for up to an hour.
            - name: Remove the app token from the checkout
              if: always() && steps.checkout.outcome == 'success'
              run: git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
