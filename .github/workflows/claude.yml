name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # claude-code-action reads the thread and replies with its own Claude GitHub App token.
    permissions:
      contents: read
      id-token: write # claude-code-action exchanges an OIDC token for the app token.
      actions: read # The github_ci MCP server needs this. Without it, the action skips the server and Claude has no CI context.
    steps:
      - name: Checkout repository
        id: checkout
        # claude-code-action v1.0.235 can't remove the job token that checkout v6 persists, so Claude would push
        # with that read-only token and fail.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          # claude-code-action fetches the branch with these credentials, then removes them before Claude starts.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        env:
          # The comment on this setting in claude-code-review.yml explains it.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          base_branch: main

          track_progress: true

          prompt: |
            1. When asked to investigate or plan, think everything through deeply. Ask yourself: do you need data to help reproduce the issue? Do you need the user to test anything or dig up any data from the system to validate assumptions? If so, ask them instead of proceeding. The user has full access to the system and can test, debug, and provide data for you.
            2. When asked to execute, make a to-do list based on the plan laid out in the GitHub Issue. Execute, raise a PR, and report back. Note: the user _has_ to be explicit about asking you to execute. Assume Plan Mode by default, and err on the side of continuing to plan and ask for more information until the user explicitly asks you to execute.

          claude_args: |
            --model claude-opus-5-5
            --effort high

      - name: Print Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq 'map(select(.type == "result")) | last | {subtype, is_error, result, errors}' "$EXECUTION_FILE"

      # If the job is cancelled while claude-code-action runs, the action's revoke step can be skipped, and the
      # app token stays valid for up to an hour.
      - name: Remove the app token from the checkout
        if: always() && steps.checkout.outcome == 'success'
        run: git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
